# Infraestrutura local: PostgreSQL e MiniStack (SQS). A aplicação roda fora do compose (`bun run start`).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager        # somente dev/teste local
      POSTGRES_DB: wager
    ports: ["5432:5432"]
    command: ["postgres", "-c", "max_connections=300"]   # testes de concorrência abrem muitas conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20

  aws:
    # MiniStack: licença MIT, sem conta nem token; tag fixa.
    image: ministackorg/ministack:1.5.44
    ports: ["4566:4566"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
