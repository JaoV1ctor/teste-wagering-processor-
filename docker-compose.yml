# docker-compose.yml — infraestrutura local do desafio (Fase 0)
# ATENÇÃO — itens a VERIFICAR na Fase 0 (não pude testar Docker no ambiente de planejamento):
#   1) imagem do MiniStack: VERIFICADA na Fase 0 (ministackorg/ministack, MIT, tag fixa);
#   2) suporte a FIFO, MessageGroupId, DLQ/redrive e ChangeMessageVisibility: coberto por test/integration/sqs.test.ts.
# LocalStack exige conta + auth token desde 23/03/2026. Plano B: LocalStack com tag fixa da Community
# (a própria LocalStack sugere "pin" de versão antiga, p.ex. 4.12 — sem patches de segurança).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager        # somente dev/teste local
      POSTGRES_DB: wager
    ports: ["5432:5432"]
    command: ["postgres", "-c", "max_connections=300"]   # testes de concorrência abrem muitas conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20

  aws:
    # Fase 0: imagem original (nahuelnucera/ministack) NÃO existe no Docker Hub. Trocada por esta (MIT, sem conta/token).
    image: ministackorg/ministack:1.5.44
    ports: ["4566:4566"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
    # --- Plano B (descomente e comente o bloco acima):
    # image: localstack/localstack:4.12     # tag fixa; confirmar que sobe sem LOCALSTACK_AUTH_TOKEN
    # environment: { SERVICES: sqs }

  # A aplicação entra aqui na Fase 7 (Dockerfile multi-stage, USER node, sem segredos na imagem).
